<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clash of Clans - Different Troops</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
    <link rel="icon" type="image/svg+xml" href="assets/img/coc_favicon.png" />
  </head>

  <body class="d-flex flex-column min-vh-100 align-items-center p-3">

    <div class="row w-100 justify-content-center">
      <div class="col-10 col-sm-8 col-md-6 col-lg-4">
        <div class="coc-logo-container mb-4 text-center">
          <img
            src="assets/img/coc_logo.svg"
            alt="Clash of Clans Logo"
            class="img-fluid coc-logo"
            style="max-height: 100px;"
          />
        </div>
      </div>
    </div>

    <div class="row w-100 justify-content-center">
      <div class="col-12 col-md-11 col-lg-10 col-xl-9">

        <div class="coc-main-card overflow-visible my-4 mx-auto w-100">

          <div class="coc-tab-header">
            <h2 class="coc-title">Elixir Troops</h2>
          </div>

          <div class="p-3">
            <div
              id="troop-grid"
              class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-2"
            >
            </div>
          </div>

        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="troopModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content coc-modal-content">

          <div
            class="modal-header coc-modal-header text-white border-bottom border-secondary position-relative justify-content-center"
          >
            <h5 class="modal-title fw-bold" id="info-title"></h5>

            <button
              type="button"
              class="btn-close btn-close-white position-absolute end-0 me-3"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body p-3 p-md-4">
            <div class="row g-4 align-items-center">

              <div class="col-12 col-md-5 text-center">
                <div
                  class="border rounded bg-white p-3 shadow-sm coc-image-box"
                >
                  <img
                    id="info-img"
                    src=""
                    alt="Troop Image"
                    class="img-fluid coc-modal-img"
                  />
                </div>
              </div>

              <div class="col-12 col-md-7">

                <div class="mb-3">
                  <div class="d-flex justify-content-between small fw-bold">
                    <span>Damage per second</span>
                    <span id="info-dps"></span>
                  </div>
                </div>

                <div class="mb-3">
                  <div class="d-flex justify-content-between small fw-bold">
                    <span>Hitpoints</span>
                    <span id="info-hp"></span>
                  </div>
                </div>

                <div
                  class="border-top border-bottom border-secondary py-2 my-3 small"
                >

                  <div class="row py-1 align-items-center">
                    <div class="col-6">
                      <span class="text-primary fw-bold">
                        Favorite target:
                      </span>
                    </div>
                    <div class="col-6 text-end">
                      <span
                        class="fw-bold text-dark"
                        id="info-target"
                      ></span>
                    </div>
                  </div>

                  <div class="row py-1 align-items-center">
                    <div class="col-6">
                      <span class="text-primary fw-bold">
                        Damage type:
                      </span>
                    </div>
                    <div class="col-6 text-end">
                      <span
                        class="fw-bold text-dark"
                        id="info-damage-type"
                      ></span>
                    </div>
                  </div>

                  <div class="row py-1 align-items-center">
                    <div class="col-6">
                      <span class="text-primary fw-bold">
                        Targets:
                      </span>
                    </div>
                    <div class="col-6 text-end">
                      <span
                        class="fw-bold text-dark"
                        id="info-targets"
                      ></span>
                    </div>
                  </div>

                  <div class="row py-1 align-items-center">
                    <div class="col-6">
                      <span class="text-primary fw-bold">
                        Movement speed:
                      </span>
                    </div>
                    <div class="col-6 text-end">
                      <span
                        class="fw-bold text-dark"
                        id="info-speed"
                      ></span>
                    </div>
                  </div>

                </div>
              </div>

            </div>
          </div>

        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/data.js"></script>

  </body>
</html>
