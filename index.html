<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bento Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>

<body class="bg-secondary">
    <div class="container-fluid">
        <!-- First Row -->
        <div class="row g-3">
            <div class="col-6">
                <div class="bg-white shadow-sm rounded-4 p-4 mt-2" style="height: 250px"></div>
            </div>
            <div class="col-3">
                <div class="bg-white shadow-sm rounded-4 p-4 mt-2" style="height: 250px"></div>
            </div>
            <div class="col-3">
                <div class="bg-white shadow-sm rounded-4 p-4 mt-2" style="height: 250px"></div>
            </div>
        </div>

        <!-- Second Row -->
        <div class="row g-3">
            <div class="col-3">
                <div class="bg-white shadow-sm-4 rounded-4 p-4 mt-2" style="height: 400px"></div>
            </div>
            <!-- Second Column (Nintendo Switch)-->
            <div class="col-6">
                <div class="row g-1">
                    <div class="col-2">
                        <div class="bg-white shadow-sm-4 p-4 mt-2" style="height: 400px; border-radius: 64px 0 0 64px;">
                        </div>
                    </div>
                    <div class="col-8">
                        <div class="bg-white shadow-sm-4 rounded-2 p-4 mt-2" style="height: 400px"></div>
                    </div>
                    <div class="col-2">
                        <div class="bg-white shadow-sm p-4 mt-2" style="height: 400px; border-radius: 0 64px 64px 0;">
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-3">
                <div class="bg-white shadow-sm rounded-4 p-4 mt-2" style="height: 400px"></div>
            </div>
        </div>

        <!-- Third Row -->
        <div class="row g-3">
            <div class="col-6">
                <div class="bg-white shadow-sm rounded-4 p-4 mt-2" style="height: 190px"></div>
            </div>
            <div class="col-6">
                <div class="bg-white shadow-sm rounded-4 p-4 mt-2" style="height: 190px"></div>
            </div>
        </div>

    </div>
    </div>
</body>

</html>
